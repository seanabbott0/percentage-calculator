<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Percentage Calculator</title>
<style>
body{font-family:Arial;background:#eef2ff;padding:25px}
main{max-width:500px;margin:auto;background:white;padding:25px;border-radius:15px}
input,select{width:100%;padding:12px;box-sizing:border-box;margin:9px 0;border:1px solid #a5b4fc;border-radius:8px}
button{background:#4f46e5;color:white;padding:12px 18px;border:0;border-radius:8px;cursor:pointer}
#result{padding:18px;background:#e0e7ff;border-radius:8px;margin-top:18px}
</style>
</head>
<body>
<main>
<h1>Percentage Calculator</h1>
<select id="mode">
<option value="of">Find percentage of a number</option>
<option value="what">Find what percentage one number is of another</option>
<option value="change">Calculate percentage change</option>
</select>
<input id="a" type="number" step="any" placeholder="First number">
<input id="b" type="number" step="any" placeholder="Second number">
<button onclick="calculate()">Calculate</button>
<div id="result">Your result will appear here.</div>
</main>
<script>
function calculate(){
 const mode=document.getElementById("mode").value;
 const aField=document.getElementById("a");
 const bField=document.getElementById("b");
 const a=Number(aField.value),b=Number(bField.value);
 const out=document.getElementById("result");
 if(aField.value===""||bField.value===""){
  out.textContent="Please enter both numbers.";
  return;
 }
 if(mode!=="of"&&b===0){
  out.textContent="The second number cannot be zero.";
  return;
 }
 let result;
 if(mode==="of")result=a*b/100;
 else if(mode==="what")result=a/b*100;
 else result=(b-a)/Math.abs(a)*100;
 out.textContent=mode==="of"
 ?b+"% of "+a+" = "+result.toFixed(2)
 :result.toFixed(2)+"%";
}
</script>
</body>
</html>
